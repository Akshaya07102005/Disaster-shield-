# =====================================================================
# Render Deployment Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec
# =====================================================================
services:
  - type: web
    name: disaster-shield-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: USE_GEVENT
        value: ""
