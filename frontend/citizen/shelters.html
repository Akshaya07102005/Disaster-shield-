<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Havens — Disaster Shield AI</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header class="app-navbar"></header>
    
    <div class="portal-layout">
        <aside class="sidebar"></aside>
        
        <main class="portal-content">
            <div style="margin-bottom: 20px;">
                <h2 style="font-size: 24px; font-weight: 800;">Emergency Relief Shelters</h2>
                <p style="color: var(--text-secondary); font-size: 13px;">Find nearest shelter camps, food supply centers, and medical wards sorted by distance from you.</p>
            </div>

            <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; height: calc(100vh - 180px);">
                <!-- Left: Full Leaflet Map -->
                <div class="glass-panel" style="padding:0; position:relative; overflow:hidden; height: 100%;">
                    <div id="map" style="height: 100%;"></div>
                </div>
                
                <!-- Right: List sorted by Proximity -->
                <div class="glass-panel" style="display: flex; flex-direction: column; overflow: hidden; height: 100%;">
                    <h3 style="font-size:15px; margin-bottom: 12px; border-bottom: 1.5px solid var(--border-color); padding-bottom: 8px;">
                        <i class="fa-solid fa-map-pin" style="color: var(--color-primary-light);"></i> Proximity Results
                    </h3>
                    <div id="shelter-list" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px;">
                        <div style="text-align: center; color: var(--text-secondary); padding: 30px;">
                            <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; margin-bottom: 8px;"></i>
                            <p>Loading closest safe havens...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/map.js"></script>
    <script>
        let mapInstance;
        let userLat = 13.0418;
        let userLng = 80.2341;

        window.addEventListener('DOMContentLoaded', async () => {
            const user = api.getUser();
            if (!user || user.role !== 'citizen') {
                window.location.href = '/login.html?role=citizen';
                return;
            }
            
            components.renderNavbar("Relief Shelters");
            components.renderSidebar("/citizen/shelters.html");
            
            mapInstance = initMap('map');
            
            // Get user current GPS coordinates
            navigator.geolocation.getCurrentPosition(async (pos) => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                mapInstance.setView([userLat, userLng], 13);
                L.marker([userLat, userLng]).addTo(mapInstance).bindPopup("<b>My GPS Coordinates</b>").openPopup();
                await loadShelters();
            }, async (err) => {
                await loadShelters();
            });
        });

        async function loadShelters() {
            try {
                const list = await api.request(`/api/citizen/shelters?lat=${userLat}&lng=${userLng}`);
                updateShelterMarkers(list);
                
                const container = document.getElementById('shelter-list');
                container.innerHTML = '';
                
                if (list.length === 0) {
                    container.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 20px;">No shelters mapped in Chennai sectors yet.</div>`;
                    return;
                }
                
                list.forEach(s => {
                    const box = document.createElement('div');
                    box.className = 'glass-panel';
                    box.style.padding = '12px';
                    box.style.borderLeft = '4px solid var(--color-primary-light)';
                    box.style.cursor = 'pointer';
                    box.style.transition = 'var(--transition-smooth)';
                    
                    const occPct = ((s.current_occupancy / s.capacity) * 100).toFixed(0);
                    
                    box.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom: 4px;">
                            <strong>${s.name}</strong>
                            <span class="user-badge" style="background: rgba(44, 74, 124, 0.08); border-color: transparent; color: var(--color-primary-light); font-size:10px;">${s.distance ? s.distance + ' km' : 'N/A'}</span>
                        </div>
                        <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 6px;"><b>Capacity Occupancy:</b> ${s.current_occupancy} / ${s.capacity} beds (${occPct}%)</p>
                        <div style="display:flex; justify-content:space-between; font-size:10px; color: var(--text-muted);">
                            <span><i class="fa-solid fa-phone"></i> ${s.contact || 'No hotline'}</span>
                            <span><b>Sector:</b> ${s.area_name}</span>
                        </div>
                    `;
                    
                    box.onclick = () => {
                        mapInstance.setView([s.latitude, s.longitude], 15);
                        L.popup()
                            .setLatLng([s.latitude, s.longitude])
                            .setContent(`<b>${s.name}</b><br/>Capacity Occupied: ${s.current_occupancy}/${s.capacity}`)
                            .openOn(mapInstance);
                    };
                    
                    container.appendChild(box);
                });
            } catch(e) {
                document.getElementById('shelter-list').innerHTML = `<div style="text-align: center; color: var(--color-critical); padding: 20px;">Failed to load safe havens: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
