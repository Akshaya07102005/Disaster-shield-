<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Monitoring — Government Portal</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-navbar"></header>
    
    <div class="portal-layout">
        <aside class="sidebar"></aside>
        
        <main class="portal-content">
            <div style="margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <div>
                    <h2 style="font-size: 24px; font-weight: 800;">Disaster Monitoring & Risk Zones</h2>
                    <p style="color: var(--text-secondary); font-size: 13px;">View real-time terrain telemetry and calculated risk classifications for Chennai's 426 sectors.</p>
                </div>
                <button class="btn btn-secondary" onclick="recalculateRisks()" id="btn-recalc" style="width:auto; font-weight:700;">
                    <i class="fa-solid fa-arrows-rotate"></i> Recalculate Risk Scores
                </button>
            </div>

            <div class="glass-panel" style="padding: 20px;">
                <div id="monitoring-table-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>Loading sector monitoring logs...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = api.getUser();
            if (!user || user.role !== 'gov') {
                window.location.href = '/login.html?role=gov';
                return;
            }
            
            components.renderNavbar("Disaster Monitoring");
            components.renderSidebar("/government/monitoring.html");
            
            await loadAreasList();
        });

        async function loadAreasList(recalculate = false) {
            try {
                let url = '/api/gov/areas';
                if (recalculate) url += '?recalculate=true';
                
                const list = await api.request(url);
                
                const cols = [
                    { title: "ID", field: "id", render: (val) => `<b>#${val}</b>` },
                    { title: "Sector Area Name", field: "area_name", render: (val) => `<strong>${val}</strong>` },
                    { title: "Zone District", field: "zone" },
                    { title: "Elevation (m)", field: "elevation", render: (val) => `${val.toFixed(1)}m` },
                    { title: "Water Proximity (m)", field: "water_distance", render: (val) => `${val.toFixed(0)}m` },
                    { title: "Rain Intensity (mm/h)", field: "rainfall_intensity", render: (val) => {
                        if (val > 0) return `<span style="color:var(--color-high); font-weight:700;">${val.toFixed(1)} mm/h</span>`;
                        return `<span style="color:var(--text-muted);">None</span>`;
                    }},
                    { title: "Risk Level", field: "risk_level", render: (val) => {
                        let color = 'var(--color-low)';
                        if (val === 'Critical') color = 'var(--color-critical)';
                        else if (val === 'High') color = 'var(--color-high)';
                        else if (val === 'Medium') color = 'var(--color-medium)';
                        return `<span class="user-badge" style="background:rgba(255,255,255,0.06); color:${color}; border-color:${color}; font-size:10px; font-weight:700;">${val.toUpperCase()}</span>`;
                    }},
                    { title: "Risk Score", field: "risk_score", render: (val) => `<b>${val.toFixed(4)}</b>` }
                ];
                
                components.renderDataTable('monitoring-table-container', cols, list.slice(0, 100)); // Limit to first 100 on dashboard for performance
            } catch(e) {
                console.error(e);
            }
        }

        async function recalculateRisks() {
            const btn = document.getElementById('btn-recalc');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            await loadAreasList(true);
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> Recalculate Risk Scores`;
            alert("City-wide risk classification matrices successfully updated!");
        }
    </script>
</body>
</html>
