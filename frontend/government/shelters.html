<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Monitoring — Government Portal</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-navbar"></header>
    
    <div class="portal-layout">
        <aside class="sidebar"></aside>
        
        <main class="portal-content">
            <div style="margin-bottom: 20px;">
                <h2 style="font-size: 24px; font-weight: 800;">Relief Shelter Monitoring</h2>
                <p style="color: var(--text-secondary); font-size: 13px;">Supervise safe haven occupancy levels, bedding capacities, and sector allocations.</p>
            </div>

            <!-- Capacity Grid -->
            <div class="shared-grid" style="margin-bottom: 24px;">
                <div class="glass-panel" style="border-top: 4px solid var(--color-info);">
                    <div style="font-size: 11px; color: var(--text-secondary); font-weight:700; text-transform:uppercase;">Overall Bedding Capacity</div>
                    <div style="font-size: 28px; font-weight: 800; margin: 4px 0;" id="kpi-total-capacity">0 Beds</div>
                </div>
                <div class="glass-panel" style="border-top: 4px solid var(--color-medium);">
                    <div style="font-size: 11px; color: var(--text-secondary); font-weight:700; text-transform:uppercase;">Registered Occupancy</div>
                    <div style="font-size: 28px; font-weight: 800; margin: 4px 0;" id="kpi-total-occupancy">0 Beds</div>
                </div>
                <div class="glass-panel" style="border-top: 4px solid var(--color-low);">
                    <div style="font-size: 11px; color: var(--text-secondary); font-weight:700; text-transform:uppercase;">Net Vacancy Margin</div>
                    <div style="font-size: 28px; font-weight: 800; margin: 4px 0;" id="kpi-total-vacancy">0 Beds</div>
                </div>
            </div>

            <div class="glass-panel" style="padding: 20px;">
                <h3 style="font-size: 15px; margin-bottom: 12px; font-weight: 700; border-bottom: 1.5px solid var(--border-color); padding-bottom: 8px;">
                    <i class="fa-solid fa-house-circle-exclamation" style="color: var(--color-primary-light);"></i> Mapped Shelter Haven Matrix
                </h3>
                <div id="shelters-table-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>Loading shelter statistics...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = api.getUser();
            if (!user || user.role !== 'gov') {
                window.location.href = '/login.html?role=gov';
                return;
            }
            
            components.renderNavbar("Shelter Monitoring");
            components.renderSidebar("/government/shelters.html");
            
            await loadShelters();
        });

        async function loadShelters() {
            try {
                // Fetch shelter analysis from analytics overview or ngo/analysis
                const analytics = await api.request('/api/gov/analytics/overview');
                
                let totalCap = 0;
                let totalOcc = 0;
                
                analytics.shelters.forEach(s => {
                    totalCap += s.capacity;
                    totalOcc += s.occupancy;
                });
                
                document.getElementById('kpi-total-capacity').innerText = `${totalCap} Beds`;
                document.getElementById('kpi-total-occupancy').innerText = `${totalOcc} Beds`;
                document.getElementById('kpi-total-vacancy').innerText = `${totalCap - totalOcc} Beds`;
                
                const cols = [
                    { title: "ID", field: "id", render: (val) => `<b>#${val}</b>` },
                    { title: "Relief Haven Name", field: "name", render: (val) => `<strong>${val}</strong>` },
                    { title: "Limit Capacity", field: "capacity" },
                    { title: "Current Occupancy", field: "occupancy" },
                    { title: "Bedding Availability", field: "id", render: (val, row) => `${row.capacity - row.occupancy} beds left` },
                    { title: "Capacity Utilization", field: "utilization_pct", render: (val, row) => {
                        let barColor = 'var(--color-low)';
                        if (val >= 90) barColor = 'var(--color-critical)';
                        else if (val >= 70) barColor = 'var(--color-high)';
                        else if (val >= 40) barColor = 'var(--color-medium)';
                        
                        return `
                            <div style="display:flex; align-items:center; gap:8px;">
                                <div style="background:#E2E8F0; height:8px; border-radius:4px; flex:1; width:80px;">
                                    <div style="background:${barColor}; height:100%; width:${val}%; border-radius:4px;"></div>
                                </div>
                                <span style="font-size:11px; font-weight:700; width:30px;">${val.toFixed(0)}%</span>
                            </div>
                        `;
                    }}
                ];
                
                components.renderDataTable('shelters-table-container', cols, analytics.shelters);
            } catch(e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
