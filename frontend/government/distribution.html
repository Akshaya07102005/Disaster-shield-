<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Distribution — Government Portal</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-navbar"></header>
    
    <div class="portal-layout">
        <aside class="sidebar"></aside>
        
        <main class="portal-content">
            <div style="margin-bottom: 20px;">
                <h2 style="font-size: 24px; font-weight: 800;">Logistics & Food Distribution</h2>
                <p style="color: var(--text-secondary); font-size: 13px;">Track regional ration inventories, surplus stocks, and calculated food supply requirements.</p>
            </div>

            <!-- Summary -->
            <div class="shared-grid" style="margin-bottom: 24px;">
                <div class="glass-panel" style="border-top: 4px solid var(--color-low);">
                    <div style="font-size: 11px; color: var(--text-secondary); font-weight:700; text-transform:uppercase;">Aggregate Surplus Packs</div>
                    <div style="font-size: 28px; font-weight: 800; margin: 4px 0;" id="kpi-avail">0 Packs</div>
                </div>
                <div class="glass-panel" style="border-top: 4px solid var(--color-high);">
                    <div style="font-size: 11px; color: var(--text-secondary); font-weight:700; text-transform:uppercase;">Aggregate Deficit Requirement</div>
                    <div style="font-size: 28px; font-weight: 800; margin: 4px 0;" id="kpi-req">0 Packs</div>
                </div>
            </div>

            <!-- Regional Matrix -->
            <div class="glass-panel" style="padding: 20px;">
                <h3 style="font-size: 15px; margin-bottom: 12px; font-weight: 700; border-bottom: 1.5px solid var(--border-color); padding-bottom: 8px;">
                    <i class="fa-solid fa-wheat-awn" style="color: var(--color-success);"></i> Sector Stock Distribution Details
                </h3>
                <div id="food-table-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>Loading logistics data...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = api.getUser();
            if (!user || user.role !== 'gov') {
                window.location.href = '/login.html?role=gov';
                return;
            }
            
            components.renderNavbar("Food Distribution");
            components.renderSidebar("/government/distribution.html");
            
            await loadLogistics();
        });

        async function loadLogistics() {
            try {
                // Fetch food metrics
                const data = await api.request('/api/ngo/analysis/food'); // NGO food endpoint has full breakdown list
                
                document.getElementById('kpi-avail').innerText = `${data.total_available_food_packets} Packs`;
                document.getElementById('kpi-req').innerText = `${data.total_required_food_packets} Packs`;
                
                const cols = [
                    { title: "Sector Region", field: "area_name", render: (val) => `<b>${val}</b>` },
                    { title: "Available Stock", field: "available", render: (val) => `${val} packs` },
                    { title: "Required Stock", field: "required", render: (val) => `${val} packs` },
                    { title: "Logistics Margin", field: "deficit", render: (val) => {
                        if (val > 0) {
                            return `<span class="user-badge role-gov"><i class="fa-solid fa-circle-exclamation"></i> DEFICIT: -${val} packs</span>`;
                        }
                        return `<span class="user-badge role-citizen"><i class="fa-solid fa-circle-check"></i> SURPLUS</span>`;
                    }}
                ];
                
                components.renderDataTable('food-table-container', cols, data.breakdown);
            } catch(e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
