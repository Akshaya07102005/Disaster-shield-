<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Cases — NGO Portal</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-navbar"></header>
    
    <div class="portal-layout">
        <aside class="sidebar"></aside>
        
        <main class="portal-content">
            <div style="margin-bottom: 20px;">
                <h2 style="font-size: 24px; font-weight: 800; color: var(--color-critical);">
                    <i class="fa-solid fa-triangle-exclamation"></i> Critical Priority Incidents
                </h2>
                <p style="color: var(--text-secondary); font-size: 13px;">High-urgency emergency rescues requiring immediate NGO rescue team dispatches and medical support.</p>
            </div>

            <div class="glass-panel" style="padding: 20px; border-top: 5px solid var(--color-critical);">
                <div id="ngo-critical-table-container">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px;">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>Compiling critical missions queue...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const user = api.getUser();
            if (!user || user.role !== 'ngo') {
                window.location.href = '/login.html?role=ngo';
                return;
            }
            
            components.renderNavbar("Critical Cases");
            components.renderSidebar("/ngo/critical.html");
            
            await loadCriticalMissions();
        });

        async function loadCriticalMissions() {
            try {
                const list = await api.request('/api/ngo/missions');
                
                // Filter critical & severe incidents
                const critical = list.filter(m => {
                    const d = m.sos_details;
                    if (!d) return false;
                    return (d.priority_score >= 10.0 || d.emergency_type === 'Medical' || d.emergency_type === 'Trapped') && m.status !== 'completed';
                }).sort((a, b) => {
                    const scoreA = a.sos_details ? a.sos_details.priority_score : 0;
                    const scoreB = b.sos_details ? b.sos_details.priority_score : 0;
                    return scoreB - scoreA;
                });

                const cols = [
                    { title: "Mission ID", field: "id", render: (val) => `<b style="color:var(--color-critical);">#CRIT-${val}</b>` },
                    { title: "Citizen", field: "sos_details", render: (val) => {
                        if (!val) return 'N/A';
                        return `<b>${val.citizen_name || 'Anonymous'}</b><br/><span style="font-size:10px; color:var(--text-muted);">${val.citizen_phone || ''}</span>`;
                    }},
                    { title: "Sector Area", field: "sos_details", render: (val) => val ? (val.area_name || 'Chennai Sector') : 'N/A' },
                    { title: "Hazard", field: "sos_details", render: (val) => {
                        if (!val) return 'N/A';
                        return `<span class="user-badge" style="background: rgba(220, 38, 38, 0.15); color: var(--color-critical); border-color: var(--color-critical); font-weight:800;">${val.emergency_type}</span>`;
                    }},
                    { title: "Triage Score", field: "sos_details", render: (val) => {
                        const score = val ? (val.priority_score || 0) : 0;
                        return `<span style="color:var(--color-critical); font-weight:900; font-size:14px;">${score.toFixed(1)}</span>`;
                    }},
                    { title: "Status", field: "status", render: (val) => {
                        let badgeClass = val === 'in_progress' ? 'role-ngo' : 'role-gov';
                        return `<span class="user-badge ${badgeClass}">${val.toUpperCase()}</span>`;
                    }},
                    { title: "Urgent Action", field: "id", render: (val, row) => {
                        if (row.status === 'assigned') {
                            return `<button onclick="acceptCritical(${val})" class="btn btn-primary" style="padding: 5px 12px; font-size:11px; width:auto; border-radius:4px; background:var(--color-critical); border-color:var(--color-critical);"><i class="fa-solid fa-truck-medical"></i> Urgent Deploy</button>`;
                        } else {
                            return `<a href="/ngo/map.html?mission_id=${val}" class="btn btn-secondary" style="padding: 5px 10px; font-size:11px; width:auto; border-radius:4px;"><i class="fa-solid fa-route"></i> Live Tracking</a>`;
                        }
                    }}
                ];

                components.renderDataTable('ngo-critical-table-container', cols, critical);
            } catch(e) {
                console.error("Critical queue error:", e);
                document.getElementById('ngo-critical-table-container').innerHTML = `
                    <div style="text-align: center; color: var(--text-secondary); padding: 30px;">
                        <i class="fa-solid fa-circle-check" style="color: var(--color-low); font-size: 28px; margin-bottom: 8px;"></i>
                        <p>No critical priority missions pending for your NGO at this time.</p>
                    </div>
                `;
            }
        }

        async function acceptCritical(missionId) {
            try {
                await api.request(`/api/ngo/missions/${missionId}/accept`, { method: 'POST' });
                alert("Emergency mission accepted! Rescue squad dispatched.");
                await loadCriticalMissions();
            } catch(e) {
                alert("Error: " + e.message);
            }
        }
    </script>
</body>
</html>
